[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["permit2/=lib/permit2/"]
solc = "0.8.28"
via_ir = true
evm_version = "cancun"
optimizer_runs = 190
test = "test"
skip = ["test/disabled/**/*"]

# For storage aware fuzz inputs
extra_output = ["storageLayout"]

# Helper tests read authentic Uniswap venue artifacts built by the isolated
# project under `uniswap-venues/`.
fs_permissions = [{ access = "read", path = "./uniswap-venues" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
